# config.cfg
#
# Build options of the MySQL module. Read by the SCsub on every build.
# Relative paths are resolved from the folder of this file (the module folder), not from
# the directory where scons is run.


[paths]
# Compiled Boost: contains include/ and stage/lib/
boost_path = ../thirdparty/boost

# Compiled OpenSSL: contains include/ and lib64/
openssl_path = ../thirdparty/openssl


[build]
# How Boost.MySQL is compiled inside the module:
#
#   separate     - Default. Defines BOOST_MYSQL_SEPARATE_COMPILATION; the Boost.MySQL code
#                  is compiled once, in register_types.cpp (<boost/mysql/src.hpp>).
#   header-only  - No extra define; every translation unit instantiates the Boost.MySQL
#                  code (bigger and slower build).
boost_mysql_mode = separate
