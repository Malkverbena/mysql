# config.cfg
#
# Opções de compilação do módulo MySQL. Lido pelo SCsub a cada build.
# Caminhos relativos são resolvidos a partir da pasta deste arquivo
# (a pasta do módulo), não do diretório onde o scons é executado.


[paths]
# Boost já compilado: contém include/ e stage/lib/
boost_path = ../thirdparty/boost

# OpenSSL já compilado: contém include/ e lib64/
openssl_path = ../thirdparty/openssl


[build]
# Como o Boost.MySQL é compilado dentro do módulo:
#
#   separate     - Padrão. Define BOOST_MYSQL_SEPARATE_COMPILATION; o código do
#                  Boost.MySQL é compilado uma única vez, em
#                  register_types.cpp (<boost/mysql/src.hpp>).
#   header-only  - Nenhum define extra; cada unidade de compilação
#                  instancia o código do Boost.MySQL (build maior/mais lento).
boost_mysql_mode = separate
