# config.windows.cfg
#
# Used instead of config.cfg when the build is platform=windows (see SCsub). Same keys as
# config.cfg; only the paths change, because Windows needs its own compiled Boost and
# OpenSSL (cross-compiled with MinGW-w64; see documentation/compilation.md).


[paths]
# Boost cross-compiled for Windows (MinGW-w64): contains include/ and stage/lib/
boost_path = ../thirdparty/boost-windows

# OpenSSL cross-compiled for Windows (MinGW-w64): contains include/ and lib64/
openssl_path = ../thirdparty/openssl-windows


[build]
boost_mysql_mode = separate
