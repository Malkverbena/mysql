# config.windows.cfg
#
# Usado no lugar de config.cfg quando o build é platform=windows (ver SCsub). Mesmas
# chaves de config.cfg — só os caminhos mudam, porque Windows precisa de um Boost e um
# OpenSSL compilados separadamente (cross-compilados via MinGW-w64 nesta máquina; ver
# documentation/compilation.md).


[paths]
# Boost cross-compilado pra Windows (MinGW-w64): contém include/ e stage/lib/
boost_path = ../thirdparty/boost-windows

# OpenSSL cross-compilado pra Windows (MinGW-w64): contém include/ e lib64/
openssl_path = ../thirdparty/openssl-windows


[build]
boost_mysql_mode = separate
