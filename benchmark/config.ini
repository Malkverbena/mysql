; Connection settings for the benchmark scenes, loaded by bench.gd.
;
; This file is committed to the repository, so it must never hold a real password.
; Edit it locally with your own test server's credentials to run the examples, then
; change "password" back to a placeholder (for example "minha_super_senha") before
; committing or pushing again.

[mysql]
host = "127.0.0.1"
port = 3306
user = "your_user"
password = "minha_super_senha"
database = "your_database"
