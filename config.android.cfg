# config.android.cfg
#
# Used instead of config.cfg when the build is platform=android (see SCsub). Same keys as
# config.cfg, but the paths here are the *root* of a per-architecture tree: the SCsub
# appends the current arch= (arm64, arm32, x86_64 or x86_32) to reach the actual compiled
# Boost/OpenSSL, because Android builds one .so per architecture and each needs its own
# (see documentation/instructions.md).


[paths]
# Root of the per-arch Boost cross-compiled for Android (NDK clang): each
# thirdparty/boost-android/<arch>/ contains include/ and stage/lib/
boost_path = ../thirdparty/boost-android

# Root of the per-arch OpenSSL cross-compiled for Android (NDK clang): each
# thirdparty/openssl-android/<arch>/ contains include/ and lib/
openssl_path = ../thirdparty/openssl-android


[build]
boost_mysql_mode = separate
